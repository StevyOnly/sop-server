server:
  # gin 运行模式：debug / release / test。生产环境必须为 release（关闭逐请求路由调试日志）
  mode: debug
  # 端口需与前端 vite.config.ts 代理目标一致（前端 /api/v1 代理到 http://localhost:8000）
  port: 8000
  # 上传文件存储根目录（静态资源映射根）
  uploadDir: uploads
  # 媒体资源上传目录
  uploadMediaDir: uploads/media
  # 现场照片上传目录
  uploadSceneDir: uploads/scene
  # 现场照片 base64 上传大小上限（MB）。手机原图可能较大，按现场容量配置。
  # 注意 base64 会让请求体膨胀约 1.33 倍，该值决定单张现场照片的内存占用上限。
  maxScenePhotoSizeMB: 50
  # 登录跳过密码校验（仅供本地临时调试），true 时任意密码均可登录
  # ⚠️ 严禁带入生产：生产环境必须为 false，否则任意密码可登录
  skipPasswordCheck: false

# Onebe 老库（只读）：连接它做查询，禁止任何写操作
# ⚠️ 临时测试：暂时使用 sa 账号，仅因只读账号尚未就绪。
#    生产割接前必须换回专用只读账号（仅授予 SELECT），见 run.md Step 10。
databaseOnebe:
  host: localhost
  port: 1433
  user: sa
  password: "000000"
  dbname: onebe
  ssl: false
  # 连接池
  maxOpenConns: 100
  maxIdleConns: 10
  connMaxLifetime: 3600
  connMaxIdleTime: 300

# SPAREPART 备件老库（只读）：查询备件字典数据，禁止任何写操作
databaseSPAREPART:
  host: localhost
  port: 1433
  user: sa
  password: "000000"
  dbname: SPAREPART
  ssl: false
  # 连接池
  maxOpenConns: 100
  maxIdleConns: 10
  connMaxLifetime: 3600
  connMaxIdleTime: 300

# SOPHub 新库（读写）：SOP 业务表全部在此，可读写
databaseSOPHub:
  host: localhost
  port: 1433
  user: sa
  password: "000000"
  dbname: SOPHub
  ssl: false
  # 连接池
  maxOpenConns: 100
  maxIdleConns: 10
  connMaxLifetime: 3600
  connMaxIdleTime: 300

logger:
  level: info
  dir: logs
  filename: app.log
  maxSize: 100
  maxAge: 7
  maxBackups: 10
  compress: true
  cut: day
  console: true  # 是否同时输出日志到终端控制台

jwt:
  # 签名密钥，生产环境务必改为强随机字符串（建议 >=32 字符）
  secret: "sop-dev-secret-change-me-please-0123456789"
  # token 有效期（天）
  expiresDays: 7

