server:
  # gin 运行模式：debug / release / test。生产环境必须为 release（关闭逐请求路由调试日志）
  mode: debug
  # 端口需与前端 vite.config.ts 代理目标一致（前端 /api/v1 代理到 http://localhost:8000）
  port: 8000
  # 上传文件存储根目录（静态资源映射根）
  uploadDir: uploads
  # 媒体资源上传目录
  uploadMediaDir: uploads/media
  # 现场照片上传目录
  uploadSceneDir: uploads/scene
  # 现场照片 base64 上传大小上限（MB）。手机原图可能较大，按现场容量配置。
  # 注意 base64 会让请求体膨胀约 1.33 倍，该值决定单张现场照片的内存占用上限。
  maxScenePhotoSizeMB: 50
  # 登录跳过密码校验（仅供本地临时调试），true 时任意密码均可登录
  # ⚠️ 严禁带入生产：生产环境必须为 false，否则任意密码可登录
  skipPasswordCheck: false
  # 服务对外 URL 前缀（不含端口），如 http://192.168.100.10；用于拼装资源/分享链接的绝对地址（备用）
  baseUrl: "http://212.64.29.230"
  # 静态资源对外端口（备用），与 server.port 相互独立时用于拼装静态资源完整访问地址
  staticPort: 8081
  # APP 端 appLogin 换取永久 token 的固定密钥（"是否 APP 端"标志）。
  # 与 jwt.secret 相互独立；生产务必改为强随机字符串且不要入库。
  # ⚠️ 更换此值会让所有已签发 APP 永久 token 全局失效（App 需重新 appLogin）
  appTokenKey: "sop_hub_app"

